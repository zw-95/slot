<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135">
  <!-- Super Nintendo cart face detail, redrawn against the reference shell.

       What the shell carries around its label plate, all of it face moulding rather than
       outline, and all of it shaded darker by the caller rather than painted a colour of its
       own - moulded plastic is the same plastic, just turned away from the light:

       - four vent slots in each top corner, above where the label plate sits (the plate runs
         from 17.6% down, so these live in the band of bare shell it leaves at the top).
       - one rounded bar across the lower half, the shutter the real shell carries under its
         label. Rounded corners, flat top and bottom edges: it is a slot, not an ellipse, and
         the difference is legible at this size - at 104 x 13 the ends of an ellipse read as
         lens shapes rather than as the ends of a channel.

       No foot bosses, one at each lower corner, which an earlier pass put here: the reference
       shell has none, and what made them look right was being symmetrical, which is not
       evidence. The band under the bar is bare.

       Positions are read off the reference shell and compressed with the same third the
       outline was (see cart_sfc.svg); the plate's own box lives in `cart.rs::size_for`, and
       nothing here may cross into it. -->
  <g fill="#fff">
    <path d="M14 5 h3.5 v9 h-3.5 z"/>
    <path d="M20 5 h3.5 v9 h-3.5 z"/>
    <path d="M26 5 h3.5 v9 h-3.5 z"/>
    <path d="M32 5 h3.5 v9 h-3.5 z"/>
    <path d="M204.5 5 h3.5 v9 h-3.5 z"/>
    <path d="M210.5 5 h3.5 v9 h-3.5 z"/>
    <path d="M216.5 5 h3.5 v9 h-3.5 z"/>
    <path d="M222.5 5 h3.5 v9 h-3.5 z"/>
    <rect x="68" y="94" width="104" height="13" rx="4"/>
  </g>
</svg>
