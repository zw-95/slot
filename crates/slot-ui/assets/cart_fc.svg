<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 212">
  <!-- Family Computer / NES cartridge outline.

       Drawn at 240 x 212, which is the shelf row's 240 width against the shell's own
       proportions compressed the way the Super Nintendo's is: a Famicom cart is about
       130 x 115 mm, and at the row's full scale (240 px = 57 mm) it would be 547 x 484 --
       again taller than the 480 px panel a row lives on. Compressed by the same third, it
       lands at 240 x 212, a landscape cart standing taller than an Advance one but shorter
       than a Game Boy one, which is roughly where it sits on the shelf between them.

       What is kept is what makes the shell readable at a glance, and there is almost none of
       it: the Famicom cart is a rounded box whose label does the talking. Rounded top corners
       at 14 px against slightly softer ones at the foot, no grooves, no lockout step, and
       straight sides -- the reference shell's silhouette is a rectangle that has been handled
       enough to lose its edges. -->
  <path d="M14 0 H226 A14 14 0 0 1 240 14 V198
           A14 14 0 0 1 226 212 H14 A14 14 0 0 1 0 198 V14
           A14 14 0 0 1 14 0 Z" fill="#fff"/>
</svg>
